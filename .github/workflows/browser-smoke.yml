name: Browser smoke test
on:
  workflow_run:
    workflows: ["Deploy Emonito to GitHub Pages"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  mobile-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify published mobile interactions
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
          const pageErrors = [];
          const consoleErrors = [];
          const failedRequests = [];
          page.on('pageerror', error => pageErrors.push(error.message));
          page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('requestfailed', request => failedRequests.push(request.url() + ' :: ' + (request.failure()?.errorText || 'failed')));
          try {
            const response = await page.goto('https://freezzzgames.github.io/Emonito/?smoke=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 60000 });
            if (!response || !response.ok()) throw new Error('Pages response is not OK');
            console.log('PAGE_DIAGNOSTICS', JSON.stringify(await page.evaluate(() => ({
              title: document.title,
              hasMap: !!document.querySelector('#map'),
              scripts: [...document.scripts].map(script => script.src).filter(Boolean),
              bodyStart: document.body.innerText.slice(0, 240)
            }))));
            try {
              await page.waitForFunction(() => {
                const gl = document.querySelector('#mapLibreMap canvas.maplibregl-canvas');
                const leafletTiles = document.querySelector('#map .leaflet-tile-loaded');
                const glVisible = gl && gl.getBoundingClientRect().width > 0 && gl.getBoundingClientRect().height > 0;
                const leafletVisible = leafletTiles && leafletTiles.getBoundingClientRect().width > 0 && leafletTiles.getBoundingClientRect().height > 0;
                return glVisible || leafletVisible;
              }, { timeout: 30000 });
            } catch (error) {
              console.log('MAP_INIT_DIAGNOSTICS', JSON.stringify({ pageErrors, consoleErrors, failedRequests }));
              throw error;
            }
            await page.waitForSelector('#emoAmbient', { timeout: 30000 });
            const mapBox = await page.locator('#map').boundingBox();
            if (!mapBox || mapBox.width < 250 || mapBox.height < 100) throw new Error('Map has invalid mobile dimensions');
            await page.locator('#emoAmbient').click();
            if (!(await page.locator('body').evaluate(el => el.classList.contains('emo-ambient-mode')))) throw new Error('Ambient mode did not activate');
            await page.locator('#emoAmbient').click();
            if (await page.locator('body').evaluate(el => el.classList.contains('emo-ambient-mode'))) throw new Error('Ambient mode did not exit');
            await page.locator('#map').click({ position: { x: Math.round(mapBox.width / 2), y: Math.round(mapBox.height / 2) } });
            await page.waitForFunction(() => {
              const el = document.querySelector('#emoInspector');
              return el && !el.hidden;
            }, { timeout: 15000 });
            await page.locator('#layerMenuToggle').click();
            if (await page.locator('#layerMenuToggle').getAttribute('aria-expanded') !== 'true') throw new Error('Layer menu did not open');
            // Both engines must render in 2D while Leaflet keeps the interactive overlay stack.
            await page.locator('#mapEngineMapLibre').click();
            await page.waitForFunction(() => {
              const base = document.querySelector('#mapLibreMap');
              return base && !base.hidden && base.querySelector('canvas.maplibregl-canvas');
            }, { timeout: 20000 });
            if (!(await page.locator('#map').evaluate(el => el.classList.contains('maplibre-overlay-active')))) throw new Error('MapLibre mode did not activate');
            await page.locator('#mapEngineLeaflet').click();
            if (await page.locator('#map').evaluate(el => el.classList.contains('maplibre-overlay-active'))) throw new Error('Leaflet mode did not restore');
            for (const layer of ['museums', 'theatres', 'exhibitions', 'shops']) {
              if (!(await page.locator('[data-layer-toggle="' + layer + '"]').count())) throw new Error('Missing POI layer: ' + layer);
            }
            await page.locator('[data-layer-toggle="museums"]').check();
            await page.waitForFunction(() => {
              const el = document.querySelector('#museumsStatus');
              return el && /ЗАПРОС|ГОТОВО|НЕДОСТУПНО|УВЕЛИЧИВАЕМ/.test(el.textContent);
            }, { timeout: 10000 });
            await page.locator('[data-layer-toggle="museums"]').uncheck();
            await page.locator('[data-category="weather"]').click();
            if (await page.locator('#environmentWatch').evaluate(el => el.classList.contains('category-screen-hidden'))) throw new Error('Weather category did not reveal environment panel');
            if (pageErrors.length) throw new Error('Browser runtime errors: ' + pageErrors.join(' | '));
            console.log('PASS: published map basemap (Leaflet tiles or MapLibre canvas), geo-inspector, layer menu, category navigation and ambient mode.');
          } finally {
            await browser.close();
          }
          NODE
