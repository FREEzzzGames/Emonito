name: Validate Emonito
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate HTML structure and referenced element IDs
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, sys

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id':
                          if value in self.ids:
                              self.errors.append('duplicate id: ' + value)
                          self.ids.add(value)

          html = Path('index.html').read_text()
          parser = Parser()
          parser.feed(html)
          parser.close()
          js = Path('app.js').read_text()
          patterns = [
              r"\$\(['\"]([A-Za-z][A-Za-z0-9_-]*)['\"]\)",
              r"(?:\$status|text|setList)\(['\"]([A-Za-z][A-Za-z0-9_-]*)['\"]"
          ]
          refs = set()
          for pattern in patterns:
              refs.update(re.findall(pattern, js))
          # These IDs are created by setupMobileNavigation() at runtime, not in static HTML.
          dynamic_ids = {'mobileSelectedCoords', 'mobileLocate', 'mobileReset'}
          missing = sorted(refs - parser.ids - dynamic_ids)
          if parser.errors or missing:
              print('HTML errors:', parser.errors)
              print('Missing element IDs:', missing)
              sys.exit(1)
          print(f'HTML parsed; {len(parser.ids)} unique IDs; all {len(refs)} literal JS ID references exist.')
          PY